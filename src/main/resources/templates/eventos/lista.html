<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<title>Eventos</title>
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>
	
	<div class="container">
	
	

	<h1>Lista de eventos</h1>

	<table class="highlight">
	
	<thead>
	
	<tr>
	
	<th>Id</th>
	<th>Nome</th>
	<th>Local</th>
	<th>Data</th>
	<th>Horário</th>
	
	
	
	
	</tr>
	
	</thead>
	
	<tbody th:each="e : ${eventos}">
 <tr>
  <td><span th:text="${e.id}"></span></td>
  <td><a th:href="@{/eventos/{id}(id=${e.id})}"><span th:text="${e.nome}"></span></a></td>
  <td><span th:text="${e.local}"></span></td>
  <td><span th:text="${e.data}"></span></td>
  <td><span th:text="${e.horario}"></span></td>
 </tr>
</tbody>
	</table>
	</div>

</body>
</html>
